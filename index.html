<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Vesty 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #ffd6e8 0%, #ffc2d9 50%, #e8c5ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .hearts span {
      position: fixed;
      bottom: -40px;
      font-size: 24px;
      opacity: 0.6;
      animation: float linear infinite;
      pointer-events: none;
    }
    @keyframes float {
      to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(214, 51, 132, 0.25);
      max-width: 440px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .hello { color: #c2185b; font-size: 18px; margin-bottom: 8px; }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #d63384;
      font-size: clamp(36px, 9vw, 52px);
      margin-bottom: 36px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    button {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 20px;
      border: none;
      border-radius: 50px;
      padding: 14px 42px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #yes {
      background: #ff4d94;
      color: white;
      box-shadow: 0 6px 18px rgba(255, 77, 148, 0.45);
    }
    #yes:hover { transform: scale(1.08); }

    #no {
      background: white;
      color: #d63384;
      border: 2px solid #ff9ec4;
      transition: left 0.2s ease, top 0.2s ease;
    }

    #result { display: none; }
    #result h1 { margin-bottom: 12px; font-size: clamp(30px, 8vw, 44px); }
    #result p { color: #c2185b; font-size: 20px; }
    .big-emoji { font-size: 72px; margin-bottom: 12px; animation: pop 0.6s ease; }
    @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <div class="card" id="question">
    <p class="hello">Hey Vesty 🌸</p>
    <h1>Are You Gezh?</h1>
    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </div>

  <div class="card" id="result">
    <div class="big-emoji">🥳💖</div>
    <h1>Finally u admit it!</h1>
    <p>That You Are Gezh, Vesty 😂</p>
  </div>

  <script>
    // Floating hearts in the background
    const hearts = document.getElementById('hearts');
    const icons = ['💖', '💕', '🌸', '💗', '✨'];
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('span');
      h.textContent = icons[i % icons.length];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDuration = 6 + Math.random() * 8 + 's';
      h.style.animationDelay = Math.random() * 8 + 's';
      hearts.appendChild(h);
    }

    // The "No" button runs away
    const no = document.getElementById('no');
    function runAway(e) {
      if (e) e.preventDefault();
      const pad = 16;
      const maxX = window.innerWidth - no.offsetWidth - pad;
      const maxY = window.innerHeight - no.offsetHeight - pad;
      no.style.position = 'fixed';
      no.style.zIndex = 5;
      no.style.left = pad + Math.random() * (maxX - pad) + 'px';
      no.style.top = pad + Math.random() * (maxY - pad) + 'px';
    }
    no.addEventListener('mouseenter', runAway);
    no.addEventListener('touchstart', runAway, { passive: false });
    no.addEventListener('click', runAway);
    no.addEventListener('focus', runAway);

    // "Yes" shows the result
    document.getElementById('yes').addEventListener('click', () => {
      document.getElementById('question').style.display = 'none';
      no.style.display = 'none';
      document.getElementById('result').style.display = 'block';
    });
  </script>
</body>
</html>
