<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Vesty 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #ffd6e8 0%, #ffc2d9 50%, #e8c5ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .hearts span {
      position: fixed;
      bottom: -40px;
      font-size: 24px;
      opacity: 0.6;
      animation: float linear infinite;
      pointer-events: none;
    }
    @keyframes float {
      to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(214, 51, 132, 0.25);
      max-width: 440px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .hello { color: #c2185b; font-size: 18px; margin-bottom: 8px; }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #d63384;
      font-size: clamp(36px, 9vw, 52px);
      margin-bottom: 36px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    button {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 20px;
      border: none;
      border-radius: 50px;
      padding: 14px 42px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #yes {
      background: #ff4d94;
      color: white;
      box-shadow: 0 6px 18px rgba(255, 77, 148, 0.45);
    }
    #yes:hover { transform: scale(1.08); }

    #no {
      background: white;
      color: #d63384;
      border: 2px solid #ff9ec4;
      transition: left 0.25s ease, top 0.25s ease;
    }

    #result { display: none; }
    #result h1 { margin-bottom: 12px; font-size: clamp(30px, 8vw, 44px); }
    #result p { color: #c2185b; font-size: 20px; }
    .big-emoji { font-size: 72px; margin-bottom: 12px; animation: pop 0.6s ease; }
    @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <div class="card" id="question">
    <p class="hello">Hey Vesty 🌸</p>
    <h1>Are You Gezh?</h1>
    <div class="buttons">
      <button id="yes">Yes</button>
      <button id="no">No</button>
    </div>
  </div>

  <div class="card" id="result">
    <div class="big-emoji">🥳💖</div>
    <h1>Finally u admit it!</h1>
    <p>That You Are Gezh, Vesty 😂</p>
  </div>

  <script>
    // Floating hearts in the background
    const hearts = document.getElementById('hearts');
    const icons = ['💖', '💕', '🌸', '💗', '✨'];
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('span');
      h.textContent = icons[i % icons.length];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDuration = 6 + Math.random() * 8 + 's';
      h.style.animationDelay = Math.random() * 8 + 's';
      hearts.appendChild(h);
    }

    // The "No" button runs away
    const no = document.getElementById('no');
    const PAD = 16;
    let pointer = { x: -999, y: -999 };

    // The part of the screen the button is allowed to use (top-left corner limits)
    function area() {
      let left = 0, top = 0;
      let right = document.documentElement.clientWidth;
      let bottom = document.documentElement.clientHeight;
      const vv = window.visualViewport;
      if (vv && vv.scale > 1.01) { // pinch-zoomed: only use what is visible
        left = vv.offsetLeft; top = vv.offsetTop;
        right = Math.min(right, vv.offsetLeft + vv.width);
        bottom = Math.min(bottom, vv.offsetTop + vv.height);
      }
      return {
        minX: left + PAD, minY: top + PAD,
        maxX: Math.max(left + PAD, right - no.offsetWidth - PAD),
        maxY: Math.max(top + PAD, bottom - no.offsetHeight - PAD)
      };
    }

    // Always clamps, so the button can never end up off-screen
    function moveTo(x, y) {
      const a = area();
      no.style.left = Math.min(Math.max(x, a.minX), a.maxX) + 'px';
      no.style.top = Math.min(Math.max(y, a.minY), a.maxY) + 'px';
    }

    function detach() {
      if (no.parentElement === document.body) return;
      // Move to <body> so it is positioned relative to the window, not the blurred card
      const r = no.getBoundingClientRect();
      document.body.appendChild(no);
      no.style.position = 'fixed';
      no.style.zIndex = 5;
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      no.offsetWidth; // force reflow so the first jump animates
    }

    function runAway(e) {
      if (e && e.cancelable) e.preventDefault();
      detach();
      const a = area();
      const cur = no.getBoundingClientRect();
      let x, y, tries = 0;
      do { // pick a spot far from where it is now and away from the pointer
        x = a.minX + Math.random() * (a.maxX - a.minX);
        y = a.minY + Math.random() * (a.maxY - a.minY);
      } while (
        (Math.hypot(x - cur.left, y - cur.top) < 150 ||
         Math.hypot(x + no.offsetWidth / 2 - pointer.x, y + no.offsetHeight / 2 - pointer.y) < 140) &&
        ++tries < 30
      );
      moveTo(x, y);
    }

    no.addEventListener('mouseenter', runAway);
    no.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (t) pointer = { x: t.clientX, y: t.clientY };
      runAway(e);
    }, { passive: false });
    no.addEventListener('click', runAway);
    no.addEventListener('focus', runAway);
    // Dodge before the cursor even touches it
    document.addEventListener('mousemove', (e) => {
      pointer = { x: e.clientX, y: e.clientY };
      const r = no.getBoundingClientRect();
      const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      if (d < 90) runAway();
    });

    // If the window changes size (rotate phone, resize, zoom), pull the button back in view
    function keepOnScreen() {
      if (no.parentElement !== document.body) return;
      moveTo(parseFloat(no.style.left), parseFloat(no.style.top));
    }
    window.addEventListener('resize', keepOnScreen);
    window.addEventListener('orientationchange', keepOnScreen);
    window.addEventListener('pageshow', keepOnScreen);
    if (window.visualViewport) {
      visualViewport.addEventListener('resize', keepOnScreen);
      visualViewport.addEventListener('scroll', keepOnScreen);
    }
    setInterval(keepOnScreen, 500); // safety net for browsers that skip resize events

    // "Yes" shows the result
    document.getElementById('yes').addEventListener('click', () => {
      document.getElementById('question').style.display = 'none';
      no.style.display = 'none';
      document.getElementById('result').style.display = 'block';
    });
  </script>
</body>
</html>
